name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck / Lint / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # --ignore-scripts: postinstall regenerates bun.nix via `bun2nix`,
        # a Nix-packaging concern that isn't installed (and isn't needed)
        # on this plain Ubuntu runner. bun.nix is committed and only
        # regenerated locally inside the Nix devShell.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bun run typecheck

      - name: Lint and format
        run: bun run lint

      - name: Test with coverage
        run: bun test --coverage
